[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "beautifulyze"
version = "0.1.0"
description = "Render audio into a multi-panel picture an LLM can read, plus a JSON digest."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "UIST Labs, LLC" }]
keywords = [
    "audio",
    "visualization",
    "spectrogram",
    "librosa",
    "llm",
    "music-information-retrieval",
]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "librosa>=0.11",
    "matplotlib>=3.8",
    "numpy>=1.24",
]

[project.optional-dependencies]
test = ["pytest>=7", "soundfile>=0.12"]

[project.scripts]
beautifulyze = "beautifulyze:main"

[tool.setuptools]
py-modules = ["beautifulyze"]
